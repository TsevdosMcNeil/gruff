# docker-compose.yml
services:
  # React front end (Create React App, react-scripts 1.x): dev server with hot reload.
  # Caddy serves it at https://${CADDY_HOSTNAME}:${WORDPRESS_SSL_PORT}/ and WordPress at /api.
  node:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: ${NODE_CONTAINER}
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # No ports: Caddy proxies to it (same origin as the API, so no CORS needed)
    environment:
      HOST: 0.0.0.0
      PORT: ${NODE_PORT}
      BROWSER: none
      # Front-end settings, all from the project .env (no frontend/.env needed).
      # CRA reads REACT_APP_* when the dev server starts or a build runs.
      REACT_APP_API_URL: ${FRONTEND_API_URL:?Set FRONTEND_API_URL in .env}
      REACT_APP_API_CUSTOM_PREFIX: ${FRONTEND_API_CUSTOM_PREFIX:-gruff-api/}
      REACT_APP_API_VERSION: ${FRONTEND_API_VERSION:-wp/v2/}
      REACT_APP_FULLPAGE_LICENSE: ${FRONTEND_FULLPAGE_LICENSE:-}
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"   # requests arrive through Caddy
      # If file-watching doesn't fire on macOS / Windows Docker Desktop, enable polling
      # (bind-mount inotify events don't cross the host boundary there):
      # CHOKIDAR_USEPOLLING: "true"
    command:
      - sh
      - -lc
      - |
        if [ ! -f node_modules/.deps-installed ] || ! cmp -s package-lock.json node_modules/.deps-installed 2>/dev/null; then
          # npm install, not npm ci: the 2018 lockfile (v1) lists the macOS-only fsevents
          # in a way npm 7+ rejects on Linux. npm install resolves it (and upgrades the lockfile).
          npm install --no-audit --no-fund
          # dedicated marker (NOT npm's own node_modules/.package-lock.json) to detect installed state
          cp package-lock.json node_modules/.deps-installed 2>/dev/null || true
        fi

        # CRA dev server
        npm start
  mysql:
    # Same database server as the live site (123reg: 10.11.19-MariaDB). Pinned, never "latest".
    # The service keeps the name "mysql" so MYSQL_HOST, phpMyAdmin and the docs don't change.
    image: mariadb:10.11
    container_name: ${MYSQL_CONTAINER}
    restart: unless-stopped
    volumes:
      # New volume name: MySQL 8 data files can't be opened by MariaDB, so the old
      # mysql_data volume is left untouched (as a backup) and MariaDB starts empty.
      - mariadb_data:/var/lib/mysql
      # Low-memory settings, shared by local and staging (the server has little RAM)
      - ./mysql-lowmem.cnf:/etc/mysql/conf.d/zz-lowmem.cnf:ro
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck: ## Add a DB healthcheck (prevents race condition on first boot)
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    # image: wordpress:latest > do not use latest to avoid unexpected breaking changes, pin to a specific version
    image: wordpress:php8.5-apache
    container_name: ${WORDPRESS_CONTAINER}
    # WordPress lives in /api (like the live site): the image installs into working_dir,
    # and Apache's document root stays /var/www/html, so /api/... maps to this folder.
    working_dir: /var/www/html/api
    depends_on:
      mysql:
        condition: service_healthy
    # Ports are managed by Caddy
    # ports:
    #  - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: ${MYSQL_HOST}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_HOME: ${WORDPRESS_HOME}
      WORDPRESS_SSL_PORT: ${WORDPRESS_SSL_PORT}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      APP_ENV: ${APP_ENV}
      ACF_PRO_LICENSE: ${ACF_PRO_LICENSE:-}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:-}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:-}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:-}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:-}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:-}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:-}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:-}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:-}
    volumes:
      - ./wordpress:/var/www/html/api
      - ./wp-config.php:/var/www/html/api/wp-config.php:ro   # <— Custom wp-config.php
      - ./logs:/var/www/html/api/logs
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    restart: unless-stopped

  phpmyadmin:
    # image: phpmyadmin:latest > do not use latest to avoid unexpected breaking changes, pin to a specific version
    image: phpmyadmin:5.2
    container_name: ${PHPMYADMIN_CONTAINER}
    depends_on:
      - mysql
    # Ports are managed by Caddy
    # ports:
    #   #  - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    restart: unless-stopped

  wpcli:
    # image: wordpress:cli  -> do not use latest to avoid unexpected breaking changes, pin to a specific version
    image: wordpress:cli-php8.5
    container_name: ${WPCLI_CONTAINER}
    depends_on: [mysql, wordpress]
    working_dir: /var/www/html/api       # same path as the wordpress container
    user: "www-data"                    # avoid root-owned files
    environment:
      WORDPRESS_DB_HOST: ${MYSQL_HOST}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_HOME: ${WORDPRESS_HOME}
      WORDPRESS_SSL_PORT: ${WORDPRESS_SSL_PORT}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:-}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:-}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:-}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:-}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:-}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:-}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:-}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:-}
    volumes:
      - ./wordpress:/var/www/html/api
      - ./wp-config.php:/var/www/html/api/wp-config.php:ro   # <— Custom wp-config.php
    entrypoint: ["wp"]                  # so ⁠ docker compose run wpcli <cmd> ⁠ runs ⁠ wp <cmd> ⁠

  caddy:
    image: caddy:2
    profiles: ["dev"]
    restart: unless-stopped
    container_name: ${CADDY_CONTAINER}
    depends_on:
      - wordpress
      - phpmyadmin
      - node
    ports:
      # - "80:80"
      # - "443:443"
      # - "${WORDPRESS_PORT}:${WORDPRESS_PORT}"   # optional HTTP listener for redirect
      - "${WORDPRESS_SSL_PORT}:${WORDPRESS_SSL_PORT}"   # HTTPS on custom port
    environment:
      WORDPRESS_SSL_PORT: ${WORDPRESS_SSL_PORT}
      CADDY_HOSTNAME: ${CADDY_HOSTNAME}
      CADDY_PRODUCTION_DOMAIN: ${CADDY_PRODUCTION_DOMAIN}
      NODE_CONTAINER: ${NODE_CONTAINER}   ## React dev server
      NODE_PORT: ${NODE_PORT}             ## React dev server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./wordpress/wp-content/uploads:/srv/api/wp-content/uploads:ro  # Caddy serves local uploads first, otherwise fetches them from the live site


volumes:
  mariadb_data: ## Persistent storage for the MariaDB data, so the database survives container restarts
  frontend_node_modules: ## Front-end node_modules kept in a container-only volume (off the host bind mount) for speed + correct arch